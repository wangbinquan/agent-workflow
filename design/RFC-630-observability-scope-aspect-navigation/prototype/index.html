<title>运行观测改版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one working column (max 1220px). Chrome on top is always the same three rows — scope bar, time
   controls, seven aspect tabs — and every aspect page follows one rhythm: tiles, a split card beside a trend
   card, then one "break down by" table. Every table, chart and timeline scrolls inside its own wrapper, so the
   page body never scrolls sideways. Tokens mirror the product's styles.css, chart tokens included. */
:root{
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --bg:#f8f9fb;--panel:#ffffff;--border:#e3e5ea;--border-strong:#a9aeb9;--text:#1f2328;--muted:#5b6271;
  --accent:#1f5fda;--accent-fill:#1f5fda;--on-accent:#ffffff;--accent-wash:#eaf0fc;
  --success-fg:#1b6d34;--success-bg:#e8f1ea;--success-border:#9cc3a8;
  --warn-fg:#844700;--warn-bg:#f3ede5;--warn-border:#cdb292;
  --danger-fg:#b42318;--danger-bg:#f8e9e7;--danger-border:#e0a59f;
  --info-fg:#1d5d9f;--info-bg:#e8eff6;--info-border:#9db9d6;
  --neutral-bg:#eef0f3;
  --c1:#257de0;--c2:#f47230;--c3:#00b894;--c4:#f2a600;--c5:#ee7fac;--c-other:#b4b9c2;
  --c-ink:#0b0b0b;--c-other-ink:#0b0b0b;
  --heat-1:#cce3fd;--heat-2:#84b9f3;--heat-3:#338ced;--heat-4:#1b64be;--heat-5:#0e3d7e;
  --heat-ink-1:#10141a;--heat-ink-2:#10141a;--heat-ink-3:#10141a;--heat-ink-4:#ffffff;--heat-ink-5:#ffffff;
  --grid:#e7e9ee;--axis:#c2c6ce;--shadow:0 8px 24px rgba(16,24,40,.14);
  --st-good:#0aac23;--st-warn:#fbb315;--st-crit:#dc3c3d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181d;--panel:#1c2028;--border:#2a2f38;--border-strong:#566070;--text:#e6e7ea;--muted:#95a0b3;
    --accent:#8eb8ff;--accent-fill:#2759a5;--on-accent:#ffffff;--accent-wash:#232d40;
    --success-fg:#66d17a;--success-bg:#1f2f29;--success-border:#356246;
    --warn-fg:#ffc25c;--warn-bg:#2f2a22;--warn-border:#6b5630;
    --danger-fg:#ff8b8b;--danger-bg:#33252a;--danger-border:#7a4448;
    --info-fg:#8eb8ff;--info-bg:#232d3d;--info-border:#3d557a;
    --neutral-bg:#262b34;
    --c1:#338ced;--c2:#e76624;--c3:#00a888;--c4:#d28e05;--c5:#e24d8b;--c-other:#5a6270;
    --c-ink:#0b0b0b;--c-other-ink:#ffffff;
    --heat-1:#0e3d7e;--heat-2:#1b64be;--heat-3:#338ced;--heat-4:#84b9f3;--heat-5:#cce3fd;
    --heat-ink-1:#eef1f6;--heat-ink-2:#ffffff;--heat-ink-3:#0b0b0b;--heat-ink-4:#0b0b0b;--heat-ink-5:#0b0b0b;
    --grid:#2a2f38;--axis:#454c59;--shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181d;--panel:#1c2028;--border:#2a2f38;--border-strong:#566070;--text:#e6e7ea;--muted:#95a0b3;
  --accent:#8eb8ff;--accent-fill:#2759a5;--on-accent:#ffffff;--accent-wash:#232d40;
  --success-fg:#66d17a;--success-bg:#1f2f29;--success-border:#356246;
  --warn-fg:#ffc25c;--warn-bg:#2f2a22;--warn-border:#6b5630;
  --danger-fg:#ff8b8b;--danger-bg:#33252a;--danger-border:#7a4448;
  --info-fg:#8eb8ff;--info-bg:#232d3d;--info-border:#3d557a;
  --neutral-bg:#262b34;
  --c1:#338ced;--c2:#e76624;--c3:#00a888;--c4:#d28e05;--c5:#e24d8b;--c-other:#5a6270;
  --c-ink:#0b0b0b;--c-other-ink:#ffffff;
  --heat-1:#0e3d7e;--heat-2:#1b64be;--heat-3:#338ced;--heat-4:#84b9f3;--heat-5:#cce3fd;
  --heat-ink-1:#eef1f6;--heat-ink-2:#ffffff;--heat-ink-3:#0b0b0b;--heat-ink-4:#0b0b0b;--heat-ink-5:#0b0b0b;
  --grid:#2a2f38;--axis:#454c59;--shadow:0 8px 24px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.row--between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
p,h1,h2,h3,h4,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

/* prototype note */
.proto{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border:1px solid var(--info-border);border-radius:6px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.proto strong{font-weight:600}
.proto details summary{cursor:pointer}
.proto .tbl{margin-top:8px;color:var(--text)}

/* page chrome */
.crumb{font-size:12px;color:var(--muted)}
.page-title{font-size:22px;font-weight:600;line-height:1.3;text-wrap:balance}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}
.scope__label{font-size:12px;color:var(--muted);margin-right:2px}
.scope__sep{color:var(--muted)}
.scope__seg{display:inline-flex;align-items:center;gap:4px;max-width:100%;background:var(--neutral-bg);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.scope__seg>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope__seg:hover{border-color:var(--accent)}
.scope__seg--here{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.scope__seg--add{background:transparent;border-style:dashed;font-weight:500;color:var(--muted)}
.scope__gap{flex:1 1 12px}
.scope__only{display:inline-flex;align-items:center;gap:2px;background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-fg);border-radius:6px;padding:3px 4px 3px 9px;font-size:13px;font-weight:600;max-width:100%}
.scope__only>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope__x{background:none;border:0;padding:0 5px;cursor:pointer;font-size:15px;line-height:1;color:inherit}
.basis{font-size:12px;color:var(--muted)}
.menu{position:fixed;z-index:60;min-width:220px;max-width:min(340px,calc(100vw - 16px));max-height:min(420px,70vh);overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow)}
.menu__group{padding:8px 8px 2px;font-size:11px;font-weight:600;color:var(--muted)}
.menu__item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer}
.menu__item:hover,.menu__item:focus-visible{background:var(--accent-wash)}
.menu__item[aria-current="true"]{color:var(--accent);font-weight:600}
.menu__item small{color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;min-width:0;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs__tab{flex:0 0 auto;background:none;border:0;padding:7px 14px;font-size:14px;line-height:1.25;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs__tab:hover{color:var(--text)}
.tabs__tab--active,.tabs__tab--active:hover{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.segmented{display:inline-flex;flex-wrap:wrap;border-radius:6px;background:var(--accent-wash);padding:2px;gap:2px;max-width:100%}
.segmented__option{flex:0 1 auto;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:600;padding:4px 10px;border-radius:4px;cursor:pointer;line-height:1.25;white-space:nowrap}
.segmented__option:hover{background:var(--panel)}
.segmented__option--active,.segmented__option--active:hover{background:var(--accent-fill);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border-strong);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--text);line-height:1.2;white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.linklike{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit;text-align:left}
a{color:var(--accent);text-underline-offset:2px}

/* cards and tiles */
.card{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}
.card__head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.card__title{font-size:14px;font-weight:600;line-height:1.45;text-wrap:balance}
.card__sub{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,172px),1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0;text-align:left}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--accent)}
.kpi__label{font-size:12px;color:var(--muted)}
.kpi__value{font-size:22px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.kpi__detail{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kpi__delta{font-size:12px;font-weight:600;margin-top:2px}
.kpi__delta--good{color:var(--success-fg)}
.kpi__delta--bad{color:var(--danger-fg)}
.kpi__delta--neutral{color:var(--muted)}
.kpi__go{font-size:12px;color:var(--accent);margin-top:2px}
.notice{padding:10px 14px;border:1px solid var(--info-border);border-radius:6px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.live{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.live__label{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.live__item{display:inline-flex;align-items:baseline;gap:6px;background:var(--neutral-bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.live__item:hover{border-color:var(--accent)}
.live__item b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.live__item--warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-fg)}
.live__item--danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-fg)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--panel)}
.tbl th button{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:inherit;cursor:pointer}
.tbl th button:hover{color:var(--accent)}
.tbl tr:last-child>td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.is-link{cursor:pointer}
.tbl tbody tr.is-link:hover>td{background:var(--accent-wash)}
.tbl td.name{min-width:170px;font-weight:500}
.tbl td.name small{display:block;font-weight:400;color:var(--muted)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--border-strong);border-bottom:0;background:var(--bg)}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip--success{background:var(--success-bg);color:var(--success-fg);border-color:var(--success-border)}
.chip--warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-border)}
.chip--danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-border)}
.chip--info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-border)}
.chip--neutral{background:var(--neutral-bg);color:var(--muted);border-color:var(--border)}

/* one whole split into parts */
.segbar{display:flex;gap:2px;height:28px;min-width:0}
.segbar__seg{flex:0 0 auto;min-width:3px;border:0;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;cursor:default;overflow:hidden}
.segbar__seg.is-tight{padding:0}
.segbar__seg.is-tight>span{visibility:hidden;width:0}
.segbar--thin{height:8px;min-width:110px}
.segbar--thin .segbar__seg{padding:0;min-width:2px}
.fill-c1{background:var(--c1);color:var(--c-ink)}.fill-c2{background:var(--c2);color:var(--c-ink)}
.fill-c3{background:var(--c3);color:var(--c-ink)}.fill-c4{background:var(--c4);color:var(--c-ink)}
.fill-c5{background:var(--c5);color:var(--c-ink)}.fill-other{background:var(--c-other);color:var(--c-other-ink)}
.fill-good{background:var(--st-good);color:#ffffff}.fill-warn{background:var(--st-warn);color:#0b0b0b}.fill-crit{background:var(--st-crit);color:#ffffff}
.fill-wait{background:repeating-linear-gradient(135deg,var(--c-other) 0 4px,transparent 4px 8px);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px}
.legend li{display:inline-flex;align-items:center;gap:6px;min-width:0}
.legend i{flex:0 0 auto;width:10px;height:10px;border-radius:2px}
.legend--stack{flex-direction:column;gap:6px}
.legend--stack li{justify-content:space-between;gap:12px}
.legend--stack li>span:first-child{display:inline-flex;align-items:center;gap:6px;min-width:0}
.legend__val{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px;min-width:110px}
.meter__track{flex:1 1 auto;height:8px;min-width:40px}
.meter__bar{display:block;height:8px;background:var(--c1);border-radius:0 4px 4px 0;min-width:2px}
.meter__val{flex:0 0 auto;width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* column charts */
.cols{display:flex;gap:0;align-items:stretch;height:200px;min-width:0;overflow-x:auto}
.cols__col{flex:1 0 38px;max-width:96px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;background:none;border:0;padding:0;cursor:default}
.cols__track{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:1px solid var(--axis);min-height:0}
.cols__val{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols__bar{width:22px;height:calc((100% - 22px) * var(--r));min-height:2px;background:var(--c1);border-radius:4px 4px 0 0;display:flex;flex-direction:column-reverse;gap:2px;overflow:hidden}
.cols__bar--stack{background:none}
.cols__bar--stack>i{display:block;flex:0 0 auto;min-height:1px}
.cols__bar--gap{background:none;border:1px dashed var(--axis);height:6px}
.cols__lab{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}

/* stage strip (stands in for the workflow canvas / duty map / member table) */
.strip{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.strip__arrow{align-self:center;color:var(--muted);flex:0 0 auto}
.strip__node{flex:0 0 132px;display:flex;flex-direction:column;gap:1px;padding:8px 10px;text-align:left;border:1px solid var(--border-strong);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.strip__node:hover{outline:2px solid var(--accent);outline-offset:1px}
.strip__name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip__kind{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip__val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.heat-1.heat-1{background:var(--heat-1);color:var(--heat-ink-1)}.heat-2.heat-2{background:var(--heat-2);color:var(--heat-ink-2)}
.heat-3.heat-3{background:var(--heat-3);color:var(--heat-ink-3)}.heat-4.heat-4{background:var(--heat-4);color:var(--heat-ink-4)}
.heat-5.heat-5{background:var(--heat-5);color:var(--heat-ink-5)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.scale__steps{display:inline-flex;gap:2px}
.scale__steps i{width:22px;height:10px;border-radius:2px}

/* one run on a time axis */
.tl{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.tl__in{min-width:720px;padding:10px 12px 6px}
.tl__row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;align-items:center;min-height:30px;border-bottom:1px solid var(--grid)}
.tl__row:last-child{border-bottom:0}
.tl__name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl__track{position:relative;height:18px}
.tl__bar{position:absolute;top:0;height:18px;min-width:4px;border:0;border-radius:4px;padding:0;cursor:default}
.tl__bar--failed{box-shadow:inset 0 0 0 2px var(--danger-fg)}
.tl__bar--open{border-right:3px dashed var(--text)}
.tl__axis{position:relative;height:22px;margin-left:138px}
.tl__tick{position:absolute;top:4px;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.tl__tick:first-child{transform:none}
.tl__tick:last-child{transform:translateX(-100%)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 16px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{font-size:14px;font-weight:600}

/* hints */
.hints{display:flex;flex-direction:column;gap:8px}
.hint{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.hint__title{font-size:13px;font-weight:600}
.hint__body{grid-column:2;font-size:12px;color:var(--muted)}
.hint__go{grid-row:1 / span 2;grid-column:3}
@media (max-width:560px){.hint{grid-template-columns:auto minmax(0,1fr)}.hint__go{grid-row:auto;grid-column:2}}

/* tooltip */
.tip{position:fixed;z-index:70;pointer-events:none;max-width:280px;padding:6px 9px;border-radius:6px;background:var(--text);color:var(--panel);font-size:12px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tip__v{font-weight:600;font-variant-numeric:tabular-nums}
.tip__l{opacity:.82}
@media (prefers-reduced-motion:no-preference){.segmented__option,.btn,.tabs__tab,.menu__item{transition:background-color .12s ease,color .12s ease,border-color .12s ease}}
</style>

<div class="wrap">
  <aside class="proto" aria-label="原型说明">
    <div class="row row--between">
      <span><strong>页面原型 · 全部为示例数据。</strong> 先选“范围”（看什么），再选“关注面”（关心什么）；表里的每一行都能点进去。</span>
      <span class="row">
        <span>查看身份</span>
        <span id="role-seg"></span>
      </span>
    </div>
    <details>
      <summary>原来五个页签里的内容，现在在哪</summary>
      <div class="tbl"><table style="min-width:560px"><thead><tr><th scope="col">原来</th><th scope="col">现在</th></tr></thead><tbody id="map-rows"></tbody></table></div>
    </details>
  </aside>

  <header class="row row--between">
    <div>
      <p class="crumb">运行与仓库 / 运行观测与统计</p>
      <h1 class="page-title">运行观测与统计</h1>
    </div>
    <div class="row" id="time-controls"></div>
  </header>

  <div class="scope" id="scope" aria-label="范围"></div>
  <p class="basis" id="basis"></p>
  <nav class="tabs" id="tabs" aria-label="关注面"></nav>
  <main id="view" class="stack"></main>
</div>
<div id="tip" class="tip" hidden></div>
