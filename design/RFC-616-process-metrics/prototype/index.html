<title>过程度量原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one working column (max 1180px). Summary tiles first, then cards in an auto-fit two-column grid;
   every table, canvas and chart scrolls inside its own wrapper so the page body never scrolls sideways.
   Tokens mirror the product's styles.css; chart tokens follow the validated categorical / ordinal / sequential sets. */
:root{
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --bg:#f8f9fb;--panel:#ffffff;--border:#e3e5ea;--border-strong:#a9aeb9;--text:#1f2328;--muted:#5b6271;
  --accent:#1f5fda;--accent-fill:#1f5fda;--on-accent:#ffffff;--accent-wash:#eaf0fc;
  --success-fg:#1b6d34;--success-bg:#e8f1ea;--success-border:#9cc3a8;
  --warn-fg:#844700;--warn-bg:#f3ede5;--warn-border:#cdb292;
  --danger-fg:#b42318;--danger-bg:#f8e9e7;--danger-border:#e0a59f;
  --info-fg:#1d5d9f;--info-bg:#e8eff6;--info-border:#9db9d6;
  --neutral-bg:#eef0f3;
  --c1:#257de0;--c2:#f47230;--c3:#00b894;--c4:#f2a600;--c-other:#b4b9c2;
  --c1-ink:#ffffff;--c2-ink:#ffffff;--c3-ink:#ffffff;--c4-ink:#0b0b0b;--c-other-ink:#0b0b0b;
  --o1:#84b9f3;--o2:#257de0;--o3:#0f4a96;--o1-ink:#0b0b0b;--o2-ink:#ffffff;--o3-ink:#ffffff;
  --heat-1:#cce3fd;--heat-2:#84b9f3;--heat-3:#338ced;--heat-4:#1b64be;--heat-5:#0e3d7e;
  --heat-ink-1:#10141a;--heat-ink-2:#10141a;--heat-ink-3:#10141a;--heat-ink-4:#ffffff;--heat-ink-5:#ffffff;
  --st-good:#0aac23;--st-warn:#fbb315;--st-crit:#dc3c3d;--st-good-ink:#ffffff;--st-warn-ink:#0b0b0b;--st-crit-ink:#ffffff;
  --grid:#e7e9ee;--axis:#c2c6ce;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181d;--panel:#1c2028;--border:#2a2f38;--border-strong:#566070;--text:#e6e7ea;--muted:#95a0b3;
    --accent:#8eb8ff;--accent-fill:#2759a5;--on-accent:#ffffff;--accent-wash:#232d40;
    --success-fg:#66d17a;--success-bg:#1f2f29;--success-border:#356246;
    --warn-fg:#ffc25c;--warn-bg:#2f2a22;--warn-border:#6b5630;
    --danger-fg:#ff8b8b;--danger-bg:#33252a;--danger-border:#7a4448;
    --info-fg:#8eb8ff;--info-bg:#232d3d;--info-border:#3d557a;
    --neutral-bg:#262b34;
    --c1:#338ced;--c2:#e76624;--c3:#00a888;--c4:#d28e05;--c-other:#5a6270;
    --c1-ink:#ffffff;--c2-ink:#ffffff;--c3-ink:#ffffff;--c4-ink:#ffffff;--c-other-ink:#ffffff;
    --o1:#1757ac;--o2:#338ced;--o3:#9dc8f7;--o1-ink:#ffffff;--o2-ink:#ffffff;--o3-ink:#0b0b0b;
    --heat-1:#0e3d7e;--heat-2:#1b64be;--heat-3:#338ced;--heat-4:#84b9f3;--heat-5:#cce3fd;
    --heat-ink-1:#eef1f6;--heat-ink-2:#ffffff;--heat-ink-3:#0b0b0b;--heat-ink-4:#0b0b0b;--heat-ink-5:#0b0b0b;
    --st-good:#0aac23;--st-warn:#fbb315;--st-crit:#dc3c3d;--st-good-ink:#ffffff;--st-warn-ink:#0b0b0b;--st-crit-ink:#ffffff;
    --grid:#2a2f38;--axis:#454c59;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181d;--panel:#1c2028;--border:#2a2f38;--border-strong:#566070;--text:#e6e7ea;--muted:#95a0b3;
  --accent:#8eb8ff;--accent-fill:#2759a5;--on-accent:#ffffff;--accent-wash:#232d40;
  --success-fg:#66d17a;--success-bg:#1f2f29;--success-border:#356246;
  --warn-fg:#ffc25c;--warn-bg:#2f2a22;--warn-border:#6b5630;
  --danger-fg:#ff8b8b;--danger-bg:#33252a;--danger-border:#7a4448;
  --info-fg:#8eb8ff;--info-bg:#232d3d;--info-border:#3d557a;
  --neutral-bg:#262b34;
  --c1:#338ced;--c2:#e76624;--c3:#00a888;--c4:#d28e05;--c-other:#5a6270;
  --c1-ink:#ffffff;--c2-ink:#ffffff;--c3-ink:#ffffff;--c4-ink:#ffffff;--c-other-ink:#ffffff;
  --o1:#1757ac;--o2:#338ced;--o3:#9dc8f7;--o1-ink:#ffffff;--o2-ink:#ffffff;--o3-ink:#0b0b0b;
  --heat-1:#0e3d7e;--heat-2:#1b64be;--heat-3:#338ced;--heat-4:#84b9f3;--heat-5:#cce3fd;
  --heat-ink-1:#eef1f6;--heat-ink-2:#ffffff;--heat-ink-3:#0b0b0b;--heat-ink-4:#0b0b0b;--heat-ink-5:#0b0b0b;
  --st-good:#0aac23;--st-warn:#fbb315;--st-crit:#dc3c3d;--st-good-ink:#ffffff;--st-warn-ink:#0b0b0b;--st-crit-ink:#ffffff;
  --grid:#2a2f38;--axis:#454c59;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.row--between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
p,h1,h2,h3,h4,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

/* prototype note */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--info-border);border-radius:6px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.proto strong{font-weight:600}

/* page chrome */
.crumb{font-size:12px;color:var(--muted)}
.page-title{font-size:22px;font-weight:600;line-height:1.3;text-wrap:balance}
.tabs{display:flex;gap:4px;min-width:0;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs__tab{flex:0 0 auto;background:none;border:0;padding:6px 12px;font-size:14px;line-height:1.25;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs__tab:hover{color:var(--text)}
.tabs__tab--active,.tabs__tab--active:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tabs__tab[aria-disabled="true"]{opacity:.55;cursor:default}
.tabs__tab[aria-disabled="true"]:hover{color:var(--muted)}
.segmented{display:inline-flex;flex-wrap:wrap;border-radius:6px;background:var(--accent-wash);padding:2px;gap:2px;max-width:100%}
.segmented__option{flex:0 1 auto;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:600;padding:4px 10px;border-radius:4px;cursor:pointer;line-height:1.25;white-space:nowrap}
.segmented__option:hover{background:var(--panel)}
.segmented__option--active,.segmented__option--active:hover{background:var(--accent-fill);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border-strong);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--text);line-height:1.2;white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn--primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn[disabled]{opacity:.6;cursor:default}
.linklike{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
a{color:var(--accent);text-underline-offset:2px}
.back{font-size:13px}
.detail-title{font-size:18px;font-weight:600;line-height:1.35;text-wrap:balance}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}

/* cards and tiles */
.card{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}
.card__title{font-size:14px;font-weight:600;line-height:1.45}
.card__sub{font-size:12px;color:var(--muted)}
.card>.segmented{align-self:flex-start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0}
.kpi__label{font-size:12px;color:var(--muted)}
.kpi__value{font-size:22px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.kpi__detail{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kpi__delta{font-size:12px;font-weight:600;margin-top:2px}
.kpi__delta--good{color:var(--success-fg)}
.kpi__delta--bad{color:var(--danger-fg)}
.kpis--compact{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.kpis--compact .kpi{padding:10px 12px;border-radius:8px;background:var(--bg)}
.kpis--compact .kpi__value{font-size:18px}
.notice{padding:10px 14px;border:1px solid var(--info-border);border-radius:6px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.notice--warn{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn-fg)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--panel)}
.tbl tr:last-child>td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.is-link:hover>td{background:var(--accent-wash)}
.tbl td.name{min-width:200px;font-weight:500}
.tbl tr.sub>td{background:var(--bg);padding:12px}
.tbl tr.grp>td{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted)}
.tbl td.indent{padding-left:28px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip--success{background:var(--success-bg);color:var(--success-fg);border-color:var(--success-border)}
.chip--warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-border)}
.chip--danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-border)}
.chip--info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-border)}
.chip--neutral{background:var(--neutral-bg);color:var(--muted);border-color:var(--border)}
.expander{background:none;border:0;padding:2px 8px 2px 0;cursor:pointer;color:var(--text);font-size:14px;line-height:1}

/* tall segmented bar: one whole split into parts */
.segbar{display:flex;gap:2px;height:28px;min-width:0}
.segbar__seg{flex:0 0 auto;min-width:3px;border:0;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;cursor:default}
.segbar__seg.is-tight{padding:0}
.segbar__seg.is-tight>span{visibility:hidden;width:0}
.segbar__seg:hover,.segbar__seg:focus-visible{filter:brightness(1.1)}
.segbar--thin{height:8px;min-width:120px}
.segbar--thin .segbar__seg{border-radius:4px;padding:0;min-width:2px}
.fill-c1{background:var(--c1);color:var(--c1-ink)}.fill-c2{background:var(--c2);color:var(--c2-ink)}
.fill-c3{background:var(--c3);color:var(--c3-ink)}.fill-c4{background:var(--c4);color:var(--c4-ink)}
.fill-other{background:var(--c-other);color:var(--c-other-ink)}
.fill-o1{background:var(--o1);color:var(--o1-ink)}.fill-o2{background:var(--o2);color:var(--o2-ink)}.fill-o3{background:var(--o3);color:var(--o3-ink)}
.fill-good{background:var(--st-good);color:var(--st-good-ink)}.fill-warn{background:var(--st-warn);color:var(--st-warn-ink)}.fill-crit{background:var(--st-crit);color:var(--st-crit-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px}
.legend li{display:inline-flex;align-items:center;gap:6px;min-width:0}
.legend i{flex:0 0 auto;width:10px;height:10px;border-radius:2px}
.legend b{font-weight:600}
.legend--stack{flex-direction:column;gap:6px}
.legend--stack li{justify-content:space-between;gap:12px}
.legend--stack li>span:first-child{display:inline-flex;align-items:center;gap:6px;min-width:0}
.legend__val{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ranked bars inside table cells */
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter__track{flex:1 1 auto;height:8px;min-width:48px}
.meter__bar{display:block;height:8px;background:var(--c1);border-radius:0 4px 4px 0;min-width:2px}
.meter__val{flex:0 0 auto;width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* column chart */
.cols{display:flex;gap:0;align-items:stretch;height:190px;min-width:0;overflow-x:auto}
.cols__col{flex:1 0 56px;max-width:96px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;background:none;border:0;padding:0;cursor:default}
.cols__track{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:1px solid var(--axis);min-height:0}
.cols__val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.cols__bar{width:24px;height:calc((100% - 24px) * var(--r));min-height:2px;background:var(--c1);border-radius:4px 4px 0 0}
.cols__col:hover .cols__bar,.cols__col:focus-visible .cols__bar{filter:brightness(1.12)}
.cols__lab{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}

/* line chart */
.linechart{display:block}
.chart-scroll{overflow-x:auto}
.linechart .grid{stroke:var(--grid);stroke-width:1}
.linechart .axis{stroke:var(--axis);stroke-width:1}
.linechart text{fill:var(--muted);font-size:11px;font-family:var(--font-ui)}
.linechart .endlabel{fill:var(--text);font-size:12px;font-weight:600}
.linechart .line{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.linechart .area{fill:var(--c1);opacity:.1}
.linechart .dot{fill:var(--c1);stroke:var(--panel);stroke-width:2}
.linechart .cross{stroke:var(--axis);stroke-width:1;visibility:hidden}
.linechart .hit{fill:transparent;outline:none}
details.tview summary{cursor:pointer;font-size:12px;color:var(--accent)}
details.tview .tbl{margin-top:8px}

/* workflow heat canvas */
.canvas-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.canvas{position:relative;width:1090px;height:228px}
.canvas svg{position:absolute;inset:0;width:100%;height:100%}
.canvas svg line{stroke:var(--border-strong);stroke-width:1.5}
.canvas svg path{fill:var(--border-strong)}
.loopframe{position:absolute;border:1px solid var(--border-strong);border-radius:10px;background:var(--panel)}
.loopframe__label{position:absolute;left:10px;top:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.wfnode{position:absolute;width:104px;height:70px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 8px;text-align:left;border:1px solid var(--border-strong);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.wfnode__name{font-size:12px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfnode__kind{font-size:10px;line-height:1.25;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfnode__val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.wfnode[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
/* doubled class: heat must win over the base fill of whichever card or cell carries it */
.heat-1.heat-1{background:var(--heat-1);color:var(--heat-ink-1)}.heat-2.heat-2{background:var(--heat-2);color:var(--heat-ink-2)}
.heat-3.heat-3{background:var(--heat-3);color:var(--heat-ink-3)}.heat-4.heat-4{background:var(--heat-4);color:var(--heat-ink-4)}
.heat-5.heat-5{background:var(--heat-5);color:var(--heat-ink-5)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.scale__steps{display:inline-flex;gap:2px}
.scale__steps i{width:22px;height:10px;border-radius:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 16px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* digital employee duty map */
.duty{display:flex;flex-direction:column;gap:12px}
.duty__region{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.duty__region-name{font-size:13px;font-weight:600}
.duty__lane{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:center}
.duty__lane-name{font-size:12px;color:var(--muted)}
.duty__items{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.duty__sep{color:var(--muted);font-size:12px}
.duty__item{width:128px;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 8px;text-align:left;border:1px solid var(--border-strong);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.duty__item[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.duty__item .wfnode__name{white-space:normal;overflow:visible}
@media (max-width:520px){.duty__lane{grid-template-columns:1fr}}

/* heat table */
.tbl td.heatcell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}

/* hints and themes */
.hints{display:flex;flex-direction:column;gap:10px}
.hint{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.hint__title{font-size:14px;font-weight:600}
.hint__body{grid-column:2;font-size:13px;color:var(--muted)}
.hint__go{grid-column:2;font-size:13px}
.theme{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--border)}
.theme:first-of-type{border-top:0;padding-top:0}
.theme__head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.theme__name{font-size:14px;font-weight:600}
.theme__quote{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--bg);color:var(--text)}
.theme__advice{font-size:13px}
.theme__advice b{font-weight:600}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:6px 9px;border-radius:6px;background:var(--text);color:var(--panel);font-size:12px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tip__v{font-weight:600;font-variant-numeric:tabular-nums}
.tip__l{opacity:.82}
@media (prefers-reduced-motion:no-preference){.segmented__option,.btn,.tabs__tab{transition:background-color .12s ease,color .12s ease,border-color .12s ease}}
</style>

<div class="wrap">
  <aside class="proto" aria-label="原型说明">
    <span><strong>页面原型 · 全部为示例数据。</strong> 可以点：能力类型、列表行、页签、热力图节点、任务行左侧的展开箭头、对比开关。</span>
    <span class="row">
      <span>查看身份</span>
      <span class="segmented" id="role-seg" role="group" aria-label="查看身份">
        <button type="button" class="segmented__option" data-v="manager">管理者</button>
        <button type="button" class="segmented__option" data-v="member">普通成员</button>
      </span>
    </span>
  </aside>

  <header class="row row--between">
    <div>
      <p class="crumb">运行与仓库 / 运行观测与统计</p>
      <h1 class="page-title">运行观测与统计</h1>
    </div>
    <span class="segmented" id="range-seg" role="group" aria-label="时间范围">
