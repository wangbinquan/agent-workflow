    const el=event.target;
    if(el.matches('[data-option]')){
      const q=state.questions.find(function(item){return item.id===el.dataset.id;});
      const index=Number(el.dataset.option);
      if(q.kind==='single'){q.selected=[index];q.custom='';}else{q.selected=el.checked?Array.from(new Set(q.selected.concat([index]))):q.selected.filter(function(i){return i!==index;});}
      touch(q);render();persist();
    }
    if(el.matches('[data-directive]')){state.directive=el.value;saveRender();}
  });
  root.addEventListener('click',function(event){
    const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;
    const action=el.dataset.action;
    const q=state.questions.find(function(item){return item.id===el.dataset.id;})||state.questions.find(function(item){return item.id===state.selected;});
    if(action==='overview'){state.view='map';state.returnToReview=false;saveRender();return;}
    if(action==='submitted-result'&&state.submitted){state.view=state.directive==='stop'?'output':'continued';saveRender();return;}
    if(action==='starter'){state.view='starter';saveRender();return;}
    if(action==='apply-starter'){state.view='map';saveRender('已展示模板对应的示例任务；原型不会创建真实资源。');return;}
    if(action==='focus'){state.selected=(state.questions.find(function(item){return !item.confirmed;})||q||state.questions[0]).id;state.view='focus';saveRender();return;}
    if(action==='question'||action==='edit-review'){state.selected=el.dataset.id;state.view='focus';state.returnToReview=action==='edit-review';saveRender();return;}
    if(action==='disposition'){q.status=el.dataset.value;touch(q);saveRender('决定状态已更新，需要重新确认回答。');return;}
    if(action==='confirm'){if(!valid(q))return;q.confirmed=true;state.saving=false;clearTimeout(saveTimer);saveRender('已确认你的回答；暂定和待验证内容保持原样。');return;}
    if(action==='think'||action==='quote'){
      if(state.followup.status==='running'){announce('当前追问仍在生成，可先取消或处理其他问题。');return;}
      let quote='';
      if(action==='quote'){
        const selection=window.getSelection();
        const detail=root.querySelector('.aw-detail');
        if(selection&&selection.toString().trim()&&detail&&detail.contains(selection.anchorNode)&&detail.contains(selection.focusNode))quote=selection.toString().trim();
        if(quote.length>500){announce('所选内容超过 500 字，请缩短引用。');return;}
      }
      const prompts={'依据':'这个决定依赖哪些尚未验证的假设？什么证据会改变它？','代价':'谁会受到影响？如果判断错了，会出现什么后果，由谁处理？','比较':'还有什么可行做法？它们各自适用什么条件、需要接受什么代价？','自由':''};
      state.followup={open:true,target:q.id,text:action==='quote'?'':prompts[el.dataset.prompt],quote:quote,status:'idle'};
      saveRender(action==='quote'&&!quote?'没有选中文字，你仍可直接输入自己的追问。':'追问指引已展开，可修改后发送。');
      const input=root.querySelector('[data-followup-text]');if(input)input.focus();return;
    }
    if(action==='clear-quote'){state.followup.quote='';saveRender();return;}
    if(action==='close-followup'){state.followup.open=false;saveRender();return;}
    if(action==='cancel-followup'){clearTimeout(timer);state.followup.status='idle';saveRender('已取消生成，回答和指引保留。');return;}
    if(action==='generate'){
      const f=state.followup;if(f.text.length+f.quote.length+(f.quote?12:0)>2000)return;
      const isRetry=f.status==='failed';f.status='running';saveRender('正在围绕疑点补充问题，你可以查看其他决定。');
      timer=setTimeout(function(){
        if(design.followupResult==='首次失败'&&!isRetry){state.followup.status='failed';saveRender('追问未完成，已有回答和指引保留。');return;}
        const parent=f.target;const one=newQuestion(parent,1);const two=newQuestion(parent,2);
        state.questions.push(one,two);state.followup.status='done';state.followup.open=false;
        if(state.view==='focus'&&state.selected===parent){state.selected=one.id;}
        saveRender('已在原分支增加 2 个问题，原答案保持不变。');
      },3000);return;
    }
    if(action==='review'){state.view='review';state.reviewError='';saveRender();return;}
    if(action==='submit'){
      if(state.followup.status==='running'){state.reviewError='追问仍在生成，请等待完成或先取消。';saveRender();return;}
      if(state.saving){state.reviewError='草稿正在保存，请稍候再提交。';saveRender();return;}
      const unresolved=state.questions.filter(function(item){return !item.confirmed||!valid(item);});
      if(unresolved.length){state.reviewError='还有 '+unresolved.length+' 个回答未确认，请点击“修改”完成复核。';saveRender();return;}
      state.submitting=true;saveRender('正在保存本轮决定…');
      timer=setTimeout(function(){state.submitting=false;state.submitted=true;state.submittedAt=new Date().toLocaleString('zh-CN',{hour12:false});state.view=state.directive==='stop'?'output':'continued';saveRender(state.directive==='stop'?'演示结果已生成，待验证内容完整保留。':'本轮回答已提交，继续下一轮澄清。');},700);return;
    }
  });
  render();
  if(window.Tweak){
    const tweak=new window.Tweak({container:root,onChange:function(){render();}});
    tweak.addSelect(design,'density',{label:'卡片内容',options:['完整摘要','简短摘要']});
    tweak.addSelect(design,'followupResult',{label:'追问演示情境',options:['正常生成','首次失败']});
  }
})();
</script>
