# RFC-370 M0 — CrewStation Manifest of the agent-workflow control plane.
# `scripts/crewstation-publish.ts` renders the {{...}} values from a local
# deployment profile (project-specific plan and configuration ids) and places
# the result at the root of the CrewStation project repository.
apiVersion: crewstation/v3
kind: DigitalWorker
spec:
  service:
    command: { { SERVICE_COMMAND_JSON } }
    port: 3000
    servicePlanId: '{{SERVICE_PLAN_ID}}'
    replicas: 1
    databaseRestore:
      command: [agent-workflow, migrate]
      verifyCommand: [agent-workflow, verify-database-restore]
    probes:
      startup: { path: /ready, periodSeconds: 3, timeoutSeconds: 3, failureThreshold: 100 }
      readiness: { path: /ready, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
      liveness: { path: /live, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  env: { { ENV_JSON } }
  subscriptions: { { EVENT_SUBSCRIPTIONS_JSON } }
  tasks:
    taskProfileId: '{{TASK_PROFILE_ID}}'
    runtimeImageVersionId: '{{TASK_RUNTIME_IMAGE_VERSION_ID}}'
    defaultVolumeMode: persistent
    executionControl: fenced
    acceptedTaskContractVersions: [aw-task-v1]
    agentProfiles: { { AGENT_PROFILES_JSON } }
    commandBusinessConfig: { { COMMAND_BUSINESS_CONFIG_JSON } }
    {{RECOVERY_DECLARATION}}
  data:
    objects: { planId: '{{OBJECT_STORAGE_PLAN_ID}}' }
  release:
    migrationCommand: [agent-workflow, migrate]
    migration: { compatibility: expand-only, destructive: false, rollback: switch-back }
