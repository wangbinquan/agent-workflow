name: e2e-wrapper-loop-nested
description: 'Loop-in-loop (RFC-354): every outer round opens a fresh inner generation.'
definition:
  $schema_version: 4
  inputs: []
  nodes:
    - id: outer_loop
      kind: wrapper-loop
      title: Outer loop
      nodeIds: [inner_loop]
      maxIterations: 2
      exitCondition:
        kind: port-equals
        nodeId: inner_loop
        portName: outer_signal
        value: done
      outputBindings:
        - name: outer_signal
          bind: { nodeId: inner_loop, portName: outer_signal }
        - name: final_status
          bind: { nodeId: inner_loop, portName: inner_status }
      position: { x: 100, y: 40 }
      size: { width: 780, height: 420 }
    - id: inner_loop
      kind: wrapper-loop
      title: Nested loop
      nodeIds: [loop_worker]
      maxIterations: 2
      exitCondition:
        kind: port-equals
        nodeId: loop_worker
        portName: status
        value: done
      outputBindings:
        - name: inner_status
          bind: { nodeId: loop_worker, portName: status }
        - name: outer_signal
          bind: { nodeId: loop_worker, portName: outer_status }
      position: { x: 200, y: 110 }
      size: { width: 500, height: 280 }
    - id: loop_worker
      kind: agent-single
      agentName: matrix-nested-worker
      promptTemplate: 'MATRIX_NESTED_LOOP iteration={{__iteration__}}'
      position: { x: 310, y: 190 }
    - id: final_output
      kind: output
      ports:
        - name: final_status
          bind: { nodeId: outer_loop, portName: final_status }
        - name: outer_signal
          bind: { nodeId: outer_loop, portName: outer_signal }
      position: { x: 980, y: 180 }
  edges:
    - id: outer_to_output
      source: { nodeId: outer_loop, portName: final_status }
      target: { nodeId: final_output, portName: final_status }
    - id: signal_to_output
      source: { nodeId: outer_loop, portName: outer_signal }
      target: { nodeId: final_output, portName: outer_signal }
