name: e2e-wrapper-loop-port-equals
description: Repeat until the worker returns the exact status done.
definition:
  $schema_version: 4
  inputs:
    - kind: text
      key: goal
      label: Goal
      required: true
  nodes:
    - id: goal_input
      kind: input
      inputKey: goal
      position: { x: 20, y: 180 }
    - id: loop_wrap
      kind: wrapper-loop
      title: Until status equals done
      nodeIds: [loop_worker]
      maxIterations: 3
      exitCondition:
        kind: port-equals
        nodeId: loop_worker
        portName: status
        value: done
      outputBindings:
        - name: final_status
          bind: { nodeId: loop_worker, portName: status }
      position: { x: 220, y: 80 }
      size: { width: 460, height: 280 }
    - id: loop_worker
      kind: agent-single
      agentName: matrix-loop-worker
      promptTemplate: 'MATRIX_LOOP_EQUALS iteration={{__iteration__}} goal={{goal}}'
      position: { x: 330, y: 170 }
    - id: final_output
      kind: output
      ports:
        - name: final_status
          bind: { nodeId: loop_wrap, portName: final_status }
      position: { x: 780, y: 180 }
  edges:
    - id: goal_to_worker
      source: { nodeId: goal_input, portName: goal }
      target: { nodeId: loop_worker, portName: goal }
    - id: loop_to_output
      source: { nodeId: loop_wrap, portName: final_status }
      target: { nodeId: final_output, portName: final_status }
