name: e2e-upload-input-overwrite
description: RFC-262 — upload an attachment whose name collides with a committed repo file and prove it replaces that file instead of landing beside it as "(1)".
definition:
  $schema_version: 4
  inputs:
    - kind: upload
      key: spec
      label: Spec
      required: true
      targetDir: docs
      accept: ['.md']
      minCount: 1
      maxCount: 1
      onConflict: overwrite
  nodes:
    - id: spec_input
      kind: input
      inputKey: spec
      position: { x: 20, y: 120 }
    - id: overwrite_reader
      kind: agent-single
      agentName: matrix-upload-reader
      promptTemplate: |
        MATRIX_UPLOAD_OVERWRITE
        spec={{spec}}
      position: { x: 340, y: 120 }
    - id: final_output
      kind: output
      ports:
        - name: report
          bind: { nodeId: overwrite_reader, portName: report }
      position: { x: 720, y: 120 }
  edges:
    - id: spec_to_reader
      source: { nodeId: spec_input, portName: spec }
      target: { nodeId: overwrite_reader, portName: spec }
    - id: reader_to_output
      source: { nodeId: overwrite_reader, portName: report }
      target: { nodeId: final_output, portName: report }
