name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-ci:
    name: Full CI
    # Only calculation holds a lane. CI required can wait for its lightweight
    # runner without preventing the next SHA's complete work from being admitted.
    uses: ./.github/workflows/ci-work.yml
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.ref }}-${{ (endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && 'even' || 'odd' }}
      queue: max
      cancel-in-progress: false

  ci-required:
    # One stable, unique terminal context for branch protection. It waits for
    # every gate (including all matrix legs through their parent job result) and
    # treats failure, cancellation, skip, an empty result, or any future unknown
    # result as non-success. Keep the explicit list locked by the topology test.
    name: CI required
    if: ${{ always() }}
    needs: [full-ci]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      FULL_CI_RESULT: ${{ needs['full-ci'].result }}
      LINT_RESULT: ${{ needs['full-ci'].outputs['lint'] }}
      TEST_BACKEND_RESULT: ${{ needs['full-ci'].outputs['test-backend'] }}
      TEST_BACKEND_POSTGRESQL_RESULT: ${{ needs['full-ci'].outputs['test-backend-postgresql'] }}
      TEST_FRONTEND_RESULT: ${{ needs['full-ci'].outputs['test-frontend'] }}
      SCANS_RESULT: ${{ needs['full-ci'].outputs['scans'] }}
      PERF_RESULT: ${{ needs['full-ci'].outputs['perf'] }}
      DOCS_RESULT: ${{ needs['full-ci'].outputs['docs'] }}
      BUILD_BINARY_RESULT: ${{ needs['full-ci'].outputs['build-binary'] }}
      BUILD_BINARY_MACOS_RESULT: ${{ needs['full-ci'].outputs['build-binary-macos'] }}
      BUILD_BINARY_WINDOWS_RESULT: ${{ needs['full-ci'].outputs['build-binary-windows'] }}
      E2E_RESULT: ${{ needs['full-ci'].outputs['e2e'] }}
      E2E_MACOS_RESULT: ${{ needs['full-ci'].outputs['e2e-macos'] }}
      E2E_WINDOWS_RESULT: ${{ needs['full-ci'].outputs['e2e-windows'] }}
    steps:
      - name: Require every CI job to succeed
        shell: bash
        run: |
          failed=0
          check() {
            local name result
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} concluded '${result:-missing}', expected 'success'"
              failed=1
            fi
          }

          check full-ci "$FULL_CI_RESULT"
          check lint "$LINT_RESULT"
          check test-backend "$TEST_BACKEND_RESULT"
          check test-backend-postgresql "$TEST_BACKEND_POSTGRESQL_RESULT"
          check test-frontend "$TEST_FRONTEND_RESULT"
          check scans "$SCANS_RESULT"
          check perf "$PERF_RESULT"
          check docs "$DOCS_RESULT"
          check build-binary "$BUILD_BINARY_RESULT"
          check build-binary-macos "$BUILD_BINARY_MACOS_RESULT"
          check build-binary-windows "$BUILD_BINARY_WINDOWS_RESULT"
          check e2e "$E2E_RESULT"
          check e2e-macos "$E2E_MACOS_RESULT"
          check e2e-windows "$E2E_WINDOWS_RESULT"

          exit "$failed"
