name: CI feedback

# Advisory static feedback for the newest source on each ref. The complete CI
# still validates every queued SHA and owns the only `CI required` context.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-feedback:
    name: Static feedback (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Cache bun package downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Prettier results
        # Only content-validated formatting results are persisted. A source SHA
        # makes caches refreshable; restores stay inside the tool/config boundary.
        # ESLint's typed dependency graph is deliberately not persisted here.
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-v1-${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', '**/.prettier*', '**/prettier.config.*', '!**/node_modules/**') }}-${{ github.sha }}
          restore-keys: prettier-v1-${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', '**/.prettier*', '**/prettier.config.*', '!**/node_modules/**') }}-

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
