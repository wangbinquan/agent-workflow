name: CI feedback

# Advisory static feedback for the newest code on each ref. Pure Markdown doc
# pushes skip this advisory workflow (they are validated by CI's docs-fast-gate).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'STATE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'design/**/*.md'
      - 'docs/**/*.md'
      - 'proposal/**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'STATE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'design/**/*.md'
      - 'docs/**/*.md'
      - 'proposal/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-feedback:
    name: Static feedback (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Cache bun package downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Prettier results
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-v1-${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', '**/.prettier*', '**/prettier.config.*', '!**/node_modules/**') }}-${{ github.sha }}
          restore-keys: prettier-v1-${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', '**/.prettier*', '**/prettier.config.*', '!**/node_modules/**') }}-

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
