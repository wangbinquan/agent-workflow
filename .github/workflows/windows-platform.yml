# RFC-254 — Windows platform verification.
#
# Why a separate workflow (vs. adding `windows-latest` to ci.yml's matrices):
#   * The full backend suite is ~8600 tests written against POSIX assumptions
#     that this RFC has not finished porting. Turning them all on at once buries
#     the signal we actually want under hundreds of expected failures, and every
#     unrelated PR would then be red.
#   * What we DO need immediately is a real Windows kernel for the handful of
#     things that cannot be verified anywhere else. Windows containers need a
#     Windows host, so Docker on a macOS/Linux dev box cannot substitute — and
#     Wine emulates Job Object / kernel32 semantics too incompletely to be
#     evidence for a process-lifetime boundary.
#   * So: a narrow, fast, honest job now; the full matrix lands with the rest of
#     the port (RFC-254 T31-T35).
#
# This workflow is ADDITIVE and never gates unrelated work: it runs on demand,
# nightly, and on pushes that touch the platform surface it covers.

name: windows-platform

on:
  schedule:
    # 06:15 UTC — ahead of the other nightlies so a Windows regression is the
    # first thing visible in the morning rather than queued behind them.
    - cron: '15 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/backend/src/util/platformExec.ts'
      - 'packages/backend/src/util/fileTrust.ts'
      - 'packages/backend/src/util/process.ts'
      - 'packages/backend/src/util/git.ts'
      - 'packages/backend/src/util/gitHardening.ts'
      - 'packages/backend/src/modules/source-control/**'
      - 'packages/shared/src/platformEnv.ts'
      - 'packages/backend/src/services/scriptRun.ts'
      - 'packages/backend/src/services/execution/managedProcess.ts'
      - 'packages/backend/src/services/execution/managedProcessLauncher.ts'
      - 'packages/backend/tests/rfc254-*.test.ts'
      - 'packages/backend/tests/rfc328-process-preactivation.test.ts'
      - 'packages/backend/tests/e2e-stub-argv-contract.test.ts'
      - 'packages/backend/tests/rfc308-workspace-exclude.test.ts'
      - 'packages/backend/src/util/windowsJobObject.ts'
      - 'packages/system-mocks/**'
      - 'scripts/build-binary.ts'
      - '.github/workflows/windows-platform.yml'
  pull_request:
    branches: [main]
    # Kept IDENTICAL to the push list above. They had drifted (windowsJobObject,
    # git, gitHardening were watched on push only), and the existing guard only
    # checks push ⊇ pull_request, so it structurally cannot see the reverse.
    paths:
      - 'packages/backend/src/util/platformExec.ts'
      - 'packages/backend/src/util/fileTrust.ts'
      - 'packages/backend/src/util/process.ts'
      - 'packages/backend/src/util/git.ts'
      - 'packages/backend/src/util/gitHardening.ts'
      - 'packages/backend/src/modules/source-control/**'
      - 'packages/shared/src/platformEnv.ts'
      - 'packages/backend/src/services/scriptRun.ts'
      - 'packages/backend/src/services/execution/managedProcess.ts'
      - 'packages/backend/src/services/execution/managedProcessLauncher.ts'
      - 'packages/backend/tests/rfc254-*.test.ts'
      - 'packages/backend/tests/rfc328-process-preactivation.test.ts'
      - 'packages/backend/tests/e2e-stub-argv-contract.test.ts'
      - 'packages/backend/tests/rfc308-workspace-exclude.test.ts'
      - 'packages/backend/src/util/windowsJobObject.ts'
      - 'packages/system-mocks/**'
      - 'scripts/build-binary.ts'
      - '.github/workflows/windows-platform.yml'

concurrency:
  group: windows-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Windows platform surface
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The point of this job. These suites assert win32 behaviour through an
      # injected platform on every OS; running them on a REAL Windows kernel is
      # what proves the injected model matches the actual one.
      - name: RFC-254 platform suites
        run: bun test --isolate packages/backend/tests/rfc254-platform-exec.test.ts packages/backend/tests/rfc254-file-trust.test.ts packages/backend/tests/rfc254-env-case-folding.test.ts packages/backend/tests/rfc254-git-windows.test.ts packages/backend/tests/rfc254-script-node-windows.test.ts packages/backend/tests/rfc254-process-tree-ownership.test.ts packages/backend/tests/rfc254-platform-surface-guard.test.ts packages/backend/tests/rfc328-process-preactivation.test.ts

      # Bun.which resolves npm-installed OpenCode to opencode.cmd. Detached
      # wrappers can exit 0 while losing piped stdout, so this must run on a
      # real Windows kernel rather than rely only on the pure policy assertion.
      - name: Windows .cmd version probe stdout
        run: bun test --isolate packages/backend/tests/rfc254-version-probe-cmd-wrapper.test.ts

      # Sensitive-file privacy proof on a REAL Windows kernel: the icacls DACL
      # primitive (pure parse + live icacls/whoami round-trip). Verified green
      # on a real ARM64 Windows 11 machine AND on this x64 runner. The x64 runner
      # runs as the built-in
      # Administrator (RID 500), whose owner ACE serializes as the SDDL alias `LA`
      # (not a full SID); the primitive treats `LA`/`DA` as TCB, which was the fix
      # that let this leg go green on x64 (see the evidence step below + audit-backlog).
      - name: Sensitive-file privacy (win32 DACL)
        run: bun test --isolate packages/backend/tests/rfc254-win32-acl.test.ts packages/backend/tests/rfc254-win32-acl-integration.test.ts

      # RFC-254 T31 — a `file://` plugin spec must convert via fileURLToPath, not
      # `URL.pathname` (which yields the unopenable `/C:/...` on win32, failing
      # every file-plugin install). The behavioural install here only fails on a
      # real Windows kernel, which is why it runs on this leg.
      - name: RFC-254 T31 — file:// plugin install (win32 path conversion)
        run: bun test --isolate packages/backend/tests/rfc254-plugin-file-url.test.ts

      # RFC-254 T24/T25/T25c/T25d — win32 acceptance of the subsystems whose
      # command resolution / spawn / kill-tree were ported in PR-1/PR-2: script
      # nodes (deps + bash) already run in the platform-suites step above; this
      # adds SCIP/code-intel and the memory-distill pipeline, confirmed green on
      # a real Windows 11 ARM64 VM. CI-enforcing them here makes that acceptance
      # permanent (and advances T35's backend-on-win32 convergence).
      - name: RFC-254 T24/T25c/T25d — SCIP + code-intel + memory-distill
        run: bun test --isolate packages/backend/tests/rfc258-code-intel.test.ts packages/backend/tests/structural-diff-scip-parse.test.ts packages/backend/tests/structural-diff-indexer-discovery.test.ts packages/backend/tests/memory-distill-scheduler.test.ts packages/backend/tests/distill-session-capture.test.ts packages/backend/tests/memory-distiller-source-context.test.ts

      # RFC-254 T20 (D11) — the git-credential subcommand that replaced the POSIX
      # `#!/bin/sh` askpass helper. Platform-agnostic (pure host-binding verdict +
      # env-driven subcommand, no DACL/seal dependency), so this guards the win32
      # credential path on every push. The real `git credential fill` end-to-end
      # (matching host answers, hostile submodule host refused, backslash install
      # path quoted) is verified on the real Windows machine — see STATE/plan.
      - name: RFC-254 T20 — git credential subcommand
        run: bun test --isolate packages/backend/tests/rfc205-git-credential.test.ts

      # RFC-308: Git copies the source worktree's config.worktree into a new
      # linked worktree. Prove on a real Windows kernel that the copied
      # platform exclude path is recognized, safely rebound, and an arbitrary
      # external core.excludesFile still fails closed.
      - name: RFC-308 — per-worktree platform excludes
        run: bun test --isolate packages/backend/tests/rfc308-workspace-exclude.test.ts --test-name-pattern 'rebinds a platform profile copied|still rejects a worktree profile outside'

      # RFC-254 T28b — the e2e model stand-in used to be nine `#!/bin/sh` files,
      # which is why it had to become one compiled program. These two suites are
      # what says the port is faithful, and they are RUNNABLE HERE because the
      # comparison replays a recording rather than the (unexecutable) original.
      # Windows is where a stub bug would otherwise surface as an unexplained
      # e2e failure much later.
      - name: e2e stub — golden replay + argv contract
        run: bun test --isolate packages/backend/tests/rfc254-stub-differential.test.ts packages/backend/tests/e2e-stub-argv-contract.test.ts packages/backend/tests/rfc254-e2e-node-runtime-guard.test.ts

      - name: Shared package suite
        run: bun run --filter @agent-workflow/shared test

      - name: Typecheck
        run: bun run typecheck

      # Reports what the host actually provides, so the interpreter-resolution
      # and controlled-PATH designs are checked against reality rather than
      # against what the RFC assumed. Never fails the job — it is evidence.
      - name: Report host toolchain (evidence, non-gating)
        continue-on-error: true
        shell: bash
        run: |
          echo "== git =="; where git || true; git --version || true
          echo "== git bash (must come from git, never System32) =="
          ls "C:/Program Files/Git/bin/bash.exe" || true
          where bash || true
          echo "== python candidates (python3 -> python -> py) =="
          where python3 || true; where python || true; where py || true
          echo "== node =="; where node || true
          echo "== sqlite3 (expected ABSENT; see RFC-254 D15) =="
          where sqlite3 || echo "sqlite3 not on PATH (as expected)"
          echo "== SystemRoot =="; echo "$SystemRoot"

      # RFC-254 T40b evidence: the live icacls suites pass on real ARM64
      # Windows 11 but FAIL on this x64 runner (store-unsafe / not-private). This
      # dumps what the runner's icacls seal actually produces, so the divergence
      # can be diagnosed without SSH into the runner. Non-gating evidence only.
      - name: RFC-254 T40b — icacls privacy behaviour (evidence, non-gating)
        continue-on-error: true
        shell: pwsh
        run: |
          $sid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          "USER_SID=$sid"
          "TEMP=$env:TEMP"
          $root = Join-Path $env:TEMP "aw-t40b-evi"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          $f0 = Join-Path $root "default.json"; Set-Content -Path $f0 -Value "{}" -NoNewline
          "DEFAULT_FILE_SDDL=" + (Get-Acl $f0).Sddl
          $out = & icacls "$root" /inheritance:r /grant:r ("*{0}:(OI)(CI)F" -f $sid) "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" 2>&1
          "ICACLS_EXIT=$LASTEXITCODE"
          "ICACLS_OUT=$out"
          "SEALED_DIR_SDDL=" + (Get-Acl $root).Sddl
          $f1 = Join-Path $root "child.json"; Set-Content -Path $f1 -Value "{}" -NoNewline
          "SEALED_CHILD_SDDL=" + (Get-Acl $f1).Sddl
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue

      # Proves the artifact naming (`windows-x86_64` + `.exe`) and that the
      # compiled binary actually starts on Windows. `build:binary` runs its own
      # `version` smoke at the end.
      - name: Build single binary + the e2e stub
        # `--include-e2e` also compiles the system-mocks runtime dispatcher and
        # CLI tool, so this proves both test executables start on Windows — the artifact
        # `opencodePath` will point at once the e2e leg lands (T31-T35).
        run: bun run build:binary:e2e

      - name: Show artifact
        shell: bash
        run: ls -lh dist/

      - name: Daemon doctor on Windows
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find dist -maxdepth 1 -type f -name 'agent-workflow-windows-*' | head -n 1)
          test -n "$binary"
          # `doctor` must start and report diagnostics on Windows.
          "$binary" doctor || true
          "$binary" version

      - name: The compiled stub answers on Windows
        shell: bash
        run: |
          set -euo pipefail
          stub=$(find dist -maxdepth 1 -type f -name 'stub-opencode-windows-*' | head -n 1)
          test -n "$stub"
          # Every mode answers `--version`, so this also proves the dispatcher
          # survived compilation with its mode table intact.
          AW_STUB_MODE=basic "$stub" --version
          AW_STUB_MODE=clarify "$stub" --version
          # ...and that an unknown mode still fails loudly rather than falling
          # back to `basic` (a silent fallback is how a spec ends up green over
          # the wrong stub).
          if AW_STUB_MODE=nope "$stub" --version; then
            echo "unknown mode should have failed" >&2
            exit 1
          fi

      # A source `bun test` parent is not the production chain and previously
      # stayed green while all four Windows e2e shards lost runtime stdout. Run
      # the oracle inside the compiled e2e daemon so every one of the eight
      # concurrent attempts is compiled daemon -> compiled launcher -> compiled
      # runtime, with the same durable receipt and output transport as tasks.
      - name: RFC-328 compiled daemon-launcher-runtime output
        shell: pwsh
        run: |
          $stub = Get-ChildItem -Path dist -Filter 'stub-opencode-windows-*' -File | Select-Object -First 1
          if ($null -eq $stub) { throw 'compiled stub-opencode artifact is missing' }
          $daemon = Get-ChildItem -Path dist -Filter 'agent-workflow-e2e-windows-*' -File | Select-Object -First 1
          if ($null -eq $daemon) { throw 'compiled e2e daemon artifact is missing' }
          & $daemon.FullName __managed-process-output-probe --target $stub.FullName
          if ($LASTEXITCODE -ne 0) { throw "compiled managed-process probe failed with exit $LASTEXITCODE" }

      - name: The compiled system mock tool answers on Windows
        shell: bash
        run: |
          set -euo pipefail
          tool=$(find dist -maxdepth 1 -type f -name 'system-mock-tool-windows-*' | head -n 1)
          test -n "$tool"
          "$tool" --version
