# RFC-254 T31–T34 — Windows survey (measurement, never a gate).
#
# The full backend and e2e suites have never run on Windows. Guessing which of
# their ~400 POSIX-carrying files actually break is how a port turns into a
# blind sweep, so these jobs run the suites and publish the failure lists as
# artifacts for the triage.
#
# Why its own workflow rather than a job inside `windows-platform.yml`:
#   * these runs take up to 90 minutes, and that file's `cancel-in-progress`
#     killed the first attempt the moment the next commit landed — on a repo
#     with several sessions pushing to main, a long non-gating job needs a
#     concurrency group that does NOT cancel;
#   * it also keeps the gating Windows job fast and its result unambiguous.
#
# Deleted once the matrix legs in ci.yml take over (T35).

name: windows-survey

on:
  workflow_dispatch:
  schedule:
    # 05:30 UTC — before the other nightlies, so the triage list is ready first.
    - cron: '30 5 * * *'

# NOT a workflow-level group: the backend survey runs for hours and the e2e one
# for ~10 minutes, so a shared group queues every quick e2e verification behind
# a long backend run. They measure independent suites; they queue independently.
# (Per-job `concurrency` below.)

permissions:
  contents: read

jobs:
  # RFC-254 T31/T32 — the SURVEY.
  #
  # The full backend suite has never run on Windows. ~403 of its 1023 files
  # carry at least one POSIX-only construct (hardcoded /tmp and /usr/bin, mode
  # bits, `#!/bin/sh` fixtures, process groups, symlinks), and a failure in a
  # shared `beforeAll` fails every test in its file — so the blast radius is
  # measured in files, not lines. Guessing which of them actually break is how
  # a port turns into a 400-file blind sweep.
  #
  # This job runs the whole suite and publishes the failure list as an artifact.
  # It NEVER gates: `continue-on-error` plus a non-failing shell, because its
  # output is data for the triage, not a verdict on the branch. It is deleted
  # once the matrix legs in ci.yml take over (T35).
  survey:
    name: Windows full-suite survey (non-gating)
    concurrency:
      group: windows-survey-backend
      cancel-in-progress: false
    runs-on: windows-latest
    # 90 minutes was not enough: the first run was killed at the deadline with
    # the suite still going (POSIX finishes in ~17). Windows process creation is
    # much slower and this suite spawns constantly — which is itself a finding
    # for T31: the matrix leg needs a budget of this order, or finer shards.
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the full backend suite and record what fails
        shell: bash
        run: |
          # `|| true`: a red suite is the expected outcome and the POINT of this
          # job. What must not happen is the step exploding before the summary
          # is written.
          bun run test:backend > backend-windows.log 2>&1 || true
          {
            echo "## Windows backend survey"
            echo
            echo '```'
            grep -aE "^ *[0-9]+ (pass|fail|skip)|Ran [0-9]+ tests across" backend-windows.log | tail -4 || true
            echo '```'
            echo
            echo "### Failing tests"
            echo '```'
            grep -aE "^\(fail\)" backend-windows.log | sed 's/ \[[0-9.]*m*s\]$//' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- failing files ---"
          grep -aE "^##\[group\]|^\(fail\)" backend-windows.log | head -400 || true

      - name: Upload the survey log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-backend-survey
          path: backend-windows.log
          if-no-files-found: warn

  # RFC-254 T33/T34 — the e2e SURVEY, same measure-first discipline as `survey`.
  #
  # The e2e suite is far less exposed than the backend one: T28b removed the
  # nine shell stubs, and a scan finds POSIX-only constructs in just 4 of 49
  # spec files — two of which are display-only strings that never touch disk.
  # What is left is signal semantics (Windows maps SIGTERM to TerminateProcess,
  # so the graceful-shutdown path cannot be driven by a signal there).
  #
  # Non-gating, for the same reason as `survey`: this is data for the triage.
  e2e-survey:
    name: Windows e2e survey (non-gating)
    concurrency:
      group: windows-survey-e2e
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      # ci.yml's matrix jobs do this, so a survey that does not is measuring a
      # DIFFERENT environment than the one it is predicting for. The runtime
      # playground offers a runtime per available binary, so without it that
      # spec fails for a reason the matrix leg would never hit.
      - name: Install current opencode (matches ci.yml's matrix jobs)
        shell: bash
        run: |
          bun install -g opencode-ai@latest
          export PATH="$HOME/.bun/bin:$PATH"
          opencode --version

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build the daemon + the compiled stub
        shell: bash
        run: bun run build:binary:e2e

      - name: Install Playwright chromium
        shell: bash
        run: bunx playwright install --with-deps chromium

      - name: Run the e2e suite and record what fails
        shell: bash
        run: |
          bun run e2e -- --reporter=line > e2e-windows.log 2>&1 || true
          {
            echo "## Windows e2e survey"
            echo
            echo '```'
            grep -aE "^ *[0-9]+ (passed|failed|skipped)" e2e-windows.log | tail -4 || true
            echo '```'
            echo
            echo "### Failing specs"
            echo '```'
            grep -aE "^\s+\[chromium\]" e2e-windows.log | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 e2e-windows.log || true

      # RFC-254 T34 — measure BEFORE adding the webkit nightly's windows leg.
      # A nightly that is red on arrival is the same "gate nobody reads" the
      # chromium leg's exclusion rationale argues against, so webkit gets the
      # same treatment chromium got: survey first, flip second.
      - name: Install Playwright webkit
        shell: bash
        continue-on-error: true
        run: bunx playwright install --with-deps webkit

      - name: Run the webkit suite and record what fails
        shell: bash
        continue-on-error: true
        env:
          PLAYWRIGHT_WEBKIT: '1'
        run: |
          bun run e2e -- --project=webkit --reporter=line > e2e-windows-webkit.log 2>&1 || true
          {
            echo "## Windows e2e survey — WEBKIT"
            echo
            echo '```'
            grep -aE "^ *[0-9]+ (passed|failed|flaky|skipped)" e2e-windows-webkit.log | tail -4 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -40 e2e-windows-webkit.log || true

      # RFC-254 T33 — generate the win32 visual baselines for HUMAN review.
      #
      # option-A from the plan: never auto-commit generated pixels. This job
      # produces them and uploads them; a person compares them against the
      # linux/darwin sets and commits the ones that are right. The authoritative
      # leg stays ubuntu — this third set exists so the windows leg has
      # something to compare against, not to become a second source of truth.
      #
      # `--update-snapshots` writes into the same `*-snapshots/` directories, so
      # the upload below picks up exactly the new `*-chromium-win32.png` files.
      - name: Generate win32 visual baselines (for review, never auto-committed)
        shell: bash
        continue-on-error: true
        env:
          RUN_VISUAL_REGRESSION: '1'
        run: |
          bunx playwright test e2e/visual-regression.spec.ts e2e/rfc250-visual-states.spec.ts \
            --project=chromium --update-snapshots > visual-windows.log 2>&1 || true
          {
            echo "## Windows visual baselines (T33)"
            echo
            echo '```'
            git status --porcelain -- 'e2e/*-snapshots/*win32*' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -30 visual-windows.log || true

      - name: Upload the generated win32 baselines
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-visual-baselines
          path: |
            e2e/**/*-chromium-win32.png
            visual-windows.log
          if-no-files-found: warn

      - name: Upload the e2e survey log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-e2e-survey
          path: |
            e2e-windows.log
            e2e-windows-webkit.log
          if-no-files-found: warn
